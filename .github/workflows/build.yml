name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HexServer.Modern.sln

      - name: Build
        run: dotnet build HexServer.Modern.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/HexServer.Protocol.Tests/HexServer.Protocol.Tests.csproj -c Release --no-build --verbosity normal
