name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore server
        run: dotnet restore src/HexServer.Server/HexServer.Server.csproj

      - name: Restore tests
        run: dotnet restore tests/HexServer.Protocol.Tests/HexServer.Protocol.Tests.csproj

      - name: Restore extractor
        run: dotnet restore tools/HexExtractor/HexExtractor.csproj

      - name: Restore legacy probe
        run: dotnet restore tools/LegacyLoadProbe/LegacyLoadProbe.csproj

      - name: Build server
        run: dotnet build src/HexServer.Server/HexServer.Server.csproj -c Release --no-restore

      - name: Build extractor
        run: dotnet build tools/HexExtractor/HexExtractor.csproj -c Release --no-restore

      - name: Build legacy probe
        run: dotnet build tools/LegacyLoadProbe/LegacyLoadProbe.csproj -c Release --no-restore

      - name: Build protocol self-test
        run: dotnet build tests/HexServer.Protocol.Tests/HexServer.Protocol.Tests.csproj -c Release --no-restore

      - name: Run protocol self-test
        run: dotnet run --project tests/HexServer.Protocol.Tests/HexServer.Protocol.Tests.csproj -c Release --no-build
